name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Validate registry (schemas, lifecycle, security, dependencies, ledger)
        run: zskill validate
      - name: Index is current
        run: zskill index --check
      - name: Release ledgers are append-only
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          zskill ledger-check --base "origin/${{ github.base_ref }}"
      - name: Tooling tests
        run: pytest -q
      - name: Summarise unevaluated skills
        if: always()
        run: |
          zskill validate 2>&1 | grep 'evidence-unevaluated' | sed 's/^/::notice::/' || true
